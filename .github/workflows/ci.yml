
name: CareerVerse CI

on:
  push:
    branches:
      - "**"
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  backend-quality:
    name: Django Tests, Quality & Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage bandit pip-audit

      - name: Django system check
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECRET_KEY: "ci-test-secret-key"
        run: python manage.py check

      - name: Run Django tests with coverage
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECRET_KEY: "ci-test-secret-key"
        run: |
          coverage run manage.py test academy
          coverage report -m
          coverage xml

      - name: Bandit security analysis
        run: bandit -r academy -x academy/migrations,academy/test*.py

      - name: Dependency security audit
        run: pip-audit -r requirements.txt

      - name: Django deployment check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-test-secret-key"
        run: python manage.py check --deploy

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: backend-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t careerverse-backend:ci ./backend

      - name: Build Frontend Image
        run: |
          docker build -t careerverse-frontend:ci ./frontend
  docker-publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/test-setup'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/oumaima-werghimmi/careerverse-backend:latest
            ghcr.io/oumaima-werghimmi/careerverse-backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/oumaima-werghimmi/careerverse-frontend:latest
            ghcr.io/oumaima-werghimmi/careerverse-frontend:${{ github.sha }}
