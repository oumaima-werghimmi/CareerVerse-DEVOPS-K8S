
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: careerverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: projet_django_careerverse_dev-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: careerverse-config
            - secretRef:
                name: careerverse-secret
