
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: careerverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: projet_django_careerverse_dev-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
