
apiVersion: batch/v1
kind: Job
metadata:
  name: careerverse-migrations
  namespace: careerverse
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: projet_django_careerverse_dev-backend:latest
          imagePullPolicy: Never
          command:
            - python
            - manage.py
            - migrate
          envFrom:
            - configMapRef:
                name: careerverse-config
            - secretRef:
                name: careerverse-secret
