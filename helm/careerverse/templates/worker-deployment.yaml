
apiVersion: apps/v1
kind: Deployment
metadata:
  name: push-worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app: push-worker
  template:
    metadata:
      labels:
        app: push-worker
    spec:
      containers:
        - name: push-worker
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - sh
            - -c
            - while true; do python manage.py send_push_notifications || true; sleep 60; done
          envFrom:
            - configMapRef:
                name: careerverse-config
            - secretRef:
                name: careerverse-secret
